name: Build ScanPro Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Release Signing Keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/release.jks \
            -alias scanpro \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass scanpro123 \
            -keypass scanpro123 \
            -dname "CN=ScanPro, OU=Mobile, O=ScanPro, L=Regina, ST=SK, C=CA"

      - name: Build Signed Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Outputs
        run: |
          mkdir -p output-apks
          cp app/build/outputs/apk/release/app-release.apk output-apks/ScanPro-v1.0-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk output-apks/ScanPro-v1.0-debug.apk

      - name: Upload ScanPro Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ScanPro-Release-APK
          path: output-apks/ScanPro-v1.0-release.apk
          retention-days: 90

      - name: Upload ScanPro Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ScanPro-Debug-APK
          path: output-apks/ScanPro-v1.0-debug.apk
          retention-days: 90
