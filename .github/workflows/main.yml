name: Build ScanPro Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses and Install Platform 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Release Signing Keystore
        run: |
          rm -f app/release.jks
          keytool -genkeypair -v \
            -keystore app/release.jks \
            -alias scanpro \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass scanpro123 \
            -keypass scanpro123 \
            -dname "CN=ScanPro, OU=Mobile, O=ScanPro, L=Regina, ST=SK, C=CA"

      - name: Build Signed Release and Debug APKs
        run: gradle assembleRelease assembleDebug --no-daemon --console=plain

      - name: Prepare APK Outputs
        run: |
          mkdir -p output-apks
          cp app/build/outputs/apk/release/app-release.apk output-apks/ScanPro-v1.0-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk output-apks/ScanPro-v1.0-debug.apk
          ls -lh output-apks/

      - name: Upload ScanPro Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ScanPro-Release-APK
          path: output-apks/ScanPro-v1.0-release.apk
          retention-days: 90

      - name: Upload ScanPro Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ScanPro-Debug-APK
          path: output-apks/ScanPro-v1.0-debug.apk
          retention-days: 90
